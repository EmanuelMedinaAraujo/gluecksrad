<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glücksrad</title>
  <meta name="description" content="Ein werbefreies Glücksrad, das komplett offline funktioniert.">
  <meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15121c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glücksrad">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <label class="wheel-picker">
      <span class="sr-only">Rad auswählen</span>
      <select id="wheelSelect"></select>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </label>
    <button id="editBtn" class="icon-btn" type="button" aria-label="Rad bearbeiten" title="Rad bearbeiten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z M13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="main">
    <div class="stage" id="stage">
      <canvas id="wheel" role="img" aria-label="Glücksrad"></canvas>
      <div class="pointer" id="pointer" aria-hidden="true"></div>
      <button id="hubBtn" class="hub" type="button" aria-label="Rad drehen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.7 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="elim-bar" id="elimBar" hidden>
      <span id="elimText"></span>
      <button id="elimReset" class="link-btn" type="button">Alle zurückholen</button>
    </div>

    <button id="spinBtn" class="spin-btn" type="button">Drehen!</button>
    <p id="result" class="result" aria-live="polite"></p>
  </main>

  <dialog id="editor" class="sheet" aria-labelledby="editorTitle">
    <form method="dialog" class="sheet-inner" id="editorForm">
      <div class="sheet-head">
        <h2 id="editorTitle">Rad bearbeiten</h2>
        <button class="primary-btn small" value="done" type="submit">Fertig</button>
      </div>

      <label class="field">
        <span class="field-label">Name des Rads</span>
        <input id="wheelName" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
      </label>

      <div class="field">
        <span class="field-label" id="countLabel">Anzahl der Möglichkeiten</span>
        <div class="stepper" role="group" aria-labelledby="countLabel">
          <button id="countMinus" type="button" class="step-btn" aria-label="Eine Möglichkeit weniger">−</button>
          <input id="countInput" type="number" inputmode="numeric" min="2" max="30" aria-labelledby="countLabel">
          <button id="countPlus" type="button" class="step-btn" aria-label="Eine Möglichkeit mehr">+</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Möglichkeiten</span>
        <ol id="itemList" class="item-list"></ol>
        <div class="row-actions">
          <button id="addItem" type="button" class="ghost-btn">+ Möglichkeit</button>
          <button id="shuffleItems" type="button" class="ghost-btn">Mischen</button>
        </div>
      </div>

      <fieldset class="field options">
        <legend class="field-label">Optionen</legend>
        <label class="toggle">
          <input id="optRemove" type="checkbox">
          <span>Gezogene Möglichkeit entfernen<small>Ohne Zurücklegen, bis alle einmal dran waren</small></span>
        </label>
        <label class="toggle">
          <input id="optSound" type="checkbox">
          <span>Ton</span>
        </label>
        <label class="toggle" id="optHapticsRow">
          <input id="optHaptics" type="checkbox">
          <span>Vibration</span>
        </label>
        <label class="select-row">
          <span>Drehdauer</span>
          <select id="optDuration">
            <option value="3000">Kurz</option>
            <option value="5000">Normal</option>
            <option value="8000">Lang</option>
          </select>
        </label>
      </fieldset>

      <div class="field">
        <span class="field-label">Räder</span>
        <div class="row-actions">
          <button id="newWheel" type="button" class="ghost-btn">Neues Rad</button>
          <button id="dupWheel" type="button" class="ghost-btn">Duplizieren</button>
          <button id="delWheel" type="button" class="ghost-btn danger">Löschen</button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="winnerOverlay" class="overlay" hidden>
    <div class="winner-card" role="alertdialog" aria-modal="true" aria-labelledby="winnerLabel" aria-describedby="winnerKicker">
      <p class="winner-kicker" id="winnerKicker">Das Rad hat entschieden</p>
      <p id="winnerLabel" class="winner-label"></p>
      <p id="winnerNote" class="winner-note"></p>
      <div class="winner-actions">
        <button id="againBtn" type="button" class="ghost-btn">Nochmal</button>
        <button id="okBtn" type="button" class="primary-btn">OK</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="app.js" defer></script>
</body>
</html>
